<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chinh phục Toán học – Thầy Hòa</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>

<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Segoe UI",Roboto,Arial,sans-serif;color:#fff;background:radial-gradient(ellipse at center,#e6f5ff 0%,#8ccbf2 85%);border:10px solid #c9971c;overflow:hidden}
.screen{display:none;flex-direction:column;height:calc(100dvh - 20px);padding:10px 16px;gap:10px}
.screen.active{display:flex}
h1{margin:0;text-align:center;font-size:clamp(26px,4.4vw,62px);color:#ffc400;text-shadow:2px 2px 0 #5a3a00,-1px -1px 0 #5a3a00}
h2{margin:0;font-size:clamp(20px,2.6vw,36px);color:#ffd84a}
.sub{color:#0b2a5b;text-align:center;font-size:clamp(18px,2.4vw,34px)}
.wrap{display:flex;gap:16px;flex:1;min-height:0}
.panel{background:rgba(8,35,92,.9);border:2px solid rgba(255,255,255,.7);border-radius:14px;padding:12px 16px;flex:1;min-width:0;overflow:auto;font-size:clamp(16px,1.9vw,28px);line-height:1.4}
.panel ul{margin:6px 0 0;padding-left:22px}
input{width:100%;font-size:clamp(18px,2.2vw,30px);padding:8px 12px;margin:6px 0;border-radius:10px;border:2px solid #fff;background:#fff;color:#111}
.btn{font-size:clamp(20px,2.6vw,36px);font-weight:700;padding:10px 24px;border-radius:12px;border:3px solid #fff;background:#e0a100;color:#111;cursor:pointer}
.btn:hover{background:#ffc928}
.btn:disabled{opacity:.35;cursor:not-allowed}
.err{color:#ff9d9d;min-height:1.3em;font-size:clamp(16px,1.8vw,26px)}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between;font-size:clamp(18px,2.3vw,34px);font-weight:700}
.chip{background:rgba(8,35,92,.92);border:2px solid #fff;border-radius:10px;padding:2px 14px;white-space:nowrap}
#timer{min-width:3.2em;text-align:center;color:#7dff9b}
#timer.warn{color:#ff6b6b;animation:bl .5s infinite alternate}
@keyframes bl{to{opacity:.35}}
.progress{height:10px;background:rgba(8,35,92,.25);border-radius:6px;overflow:hidden}
#bar{height:100%;width:0;background:#ffd84a;transition:width .4s}
.lbl{text-align:center;font-size:clamp(16px,1.9vw,28px);color:#0b2a5b;font-weight:700}
.main{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:14px;overflow:auto}
#qtext{background:rgba(8,35,92,.92);border:3px solid #fff;border-radius:16px;padding:16px 22px;text-align:center;font-size:clamp(22px,3.3vw,50px);font-weight:600;line-height:1.35}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{font-size:clamp(20px,2.9vw,44px);text-align:left;padding:14px 18px;border-radius:40px;border:3px solid #fff;background:rgba(8,35,92,.88);color:#fff;cursor:pointer;font-family:inherit}
.opt:hover{background:rgba(255,216,74,.3)}
.opt b{color:#ffd84a;margin-right:6px}
.opt.good{background:#1b9a42;border-color:#b6ffc9}
.opt.bad{background:#c62828;border-color:#ffc4c4}
.opt.gone{visibility:hidden}
.opt.locked{pointer-events:none}
.opts.tf .opt{text-align:center;font-weight:800;font-size:clamp(26px,4vw,60px);border-radius:20px;padding:22px}
.opts.tf .opt:first-child{border-color:#8dffa8}
.opts.tf .opt:last-child{border-color:#ff9d9d}
.ll{display:flex;gap:12px;justify-content:center}
.ll .btn{font-size:clamp(16px,2vw,28px);padding:6px 16px;background:#2a7fc9;color:#fff}
#fb{display:none;border-radius:14px;padding:10px 18px;gap:14px;align-items:center;border:3px solid #fff;background:rgba(8,35,92,.96)}
#fb.show{display:flex}
#fb.ok{border-color:#51e57a}
#fb.no{border-color:#ff6b6b}
#fbT{font-size:clamp(22px,3vw,44px);font-weight:800}
#fb.ok #fbT{color:#7dff9b}
#fb.no #fbT{color:#ff8a8a}
#fbE{font-size:clamp(17px,2.2vw,32px);line-height:1.35;margin-top:4px}
table{width:100%;border-collapse:collapse}
td,th{padding:4px 6px;text-align:left;border-bottom:1px solid rgba(255,255,255,.25)}
th{color:#ffd84a}
.big{font-size:clamp(26px,4.6vw,72px);color:#ffd84a;font-weight:800;text-align:center}
@media(max-width:760px){.wrap{flex-direction:column}.opts{grid-template-columns:1fr}.opt{border-radius:22px}body{border-width:5px}.screen{height:calc(100dvh - 10px);padding:6px}}
.panel .sub{color:#fff}.panel .lbl{color:#bfeeff}
.bellBox{height:clamp(60px,13vh,140px);text-align:center}.bellBox svg{height:100%;width:auto}.bellBox.sm{height:48px}
.ring svg{animation:rg .9s;transform-origin:50% 8%}
@keyframes rg{0%,100%{transform:rotate(0)}20%{transform:rotate(22deg)}40%{transform:rotate(-20deg)}60%{transform:rotate(14deg)}80%{transform:rotate(-8deg)}}
.brand{background:#ffc400!important;color:#0b2a5b;border-color:#0b2a5b!important}
#fx{position:fixed;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center;font-size:clamp(50px,12vw,170px);font-weight:900;opacity:0;z-index:50;text-align:center}
#fx.ok{background:radial-gradient(circle,rgba(255,236,120,.7),rgba(255,236,120,0) 70%);color:#0b6b2a;text-shadow:0 0 30px #fff;animation:fxo 1.3s}
#fx.no{background:rgba(210,30,30,.4);color:#fff;text-shadow:3px 3px 0 #700;animation:fxo 1.3s,shk .5s}
@keyframes fxo{0%{opacity:0}15%,75%{opacity:1}100%{opacity:0}}
@keyframes shk{20%{transform:translateX(-18px)}40%{transform:translateX(18px)}60%{transform:translateX(-10px)}80%{transform:translateX(10px)}}
.cf{position:fixed;top:-8vh;font-size:30px;z-index:40;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(720deg)}}
#qtext{white-space:pre-line}
#fig{text-align:center}
#fig svg{max-height:26vh;max-width:90%;height:auto;border-radius:8px}
.opts.sa{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap}
.opts.sa input{max-width:440px;text-align:center;font-size:clamp(24px,3.4vw,48px)}
#intro{display:none;position:fixed;inset:0;z-index:60;background:rgba(8,35,92,.9);align-items:center;justify-content:center;padding:20px;text-align:center}
#intro.show{display:flex}
#intro .sub{color:#fff}
#inMasc{font-size:clamp(50px,10vw,110px);animation:bn 1s infinite alternate}
@keyframes bn{to{transform:translateY(-14px)}}

/* SỬA LỖI KHÔNG CHE KHUẤT ĐỀ BÀI */
html{min-height:100%;height:auto;overflow-x:hidden;overflow-y:auto;-webkit-text-size-adjust:100%}
body{min-height:100dvh;height:auto;overflow-x:hidden;overflow-y:auto;overscroll-behavior-y:contain}
.screen{display:none;flex-direction:column;width:100%;height:auto;min-height:calc(100dvh - 20px);padding:10px 16px;gap:10px;overflow:visible}
.screen.active{display:flex}
.wrap{flex:1 0 auto;min-height:auto}
.panel{min-width:0;max-width:100%;overflow:visible;overflow-wrap:anywhere}
#game{min-height:calc(100dvh - 20px)}
#game .top{flex:0 0 auto;position:relative;z-index:2}
#game .main{flex:1 0 auto;min-height:auto;height:auto;justify-content:flex-start;overflow:visible;padding:4px 0 10px}
#qtext{display:block;width:100%;max-width:100%;min-width:0;height:auto;max-height:none;overflow:visible;overflow-wrap:anywhere;word-break:normal;white-space:pre-wrap;text-align:left;line-height:1.5;padding:clamp(12px,2.5vw,22px)}
#fig{width:100%;max-width:100%;overflow-x:auto;overflow-y:visible;padding:4px 0}
#fig svg{display:inline-block;max-width:min(100%,520px);max-height:none;height:auto}
#opts{width:100%;min-width:0;align-items:stretch}
.opt{min-width:0;max-width:100%;white-space:normal;overflow-wrap:anywhere;word-break:normal;line-height:1.4}
#opts.sa{width:100%}
#opts.sa input{min-width:0;max-width:100%}
#fb{flex:0 0 auto;width:100%;min-width:0;flex-wrap:wrap;align-items:stretch;overflow-wrap:anywhere}
#fb>div{min-width:0;flex:1 1 240px}
#fbE,#fbT{overflow-wrap:anywhere;word-break:normal}
#btnNext{flex:0 1 auto;white-space:normal}
.ll{flex:0 0 auto;flex-wrap:wrap}
.katex-display{max-width:100%;overflow-x:auto;overflow-y:hidden;padding:3px 0 8px}
.katex{max-width:100%}
#intro{overflow-y:auto;-webkit-overflow-scrolling:touch}
#intro .panel{max-height:calc(100dvh - 40px);overflow-y:auto;-webkit-overflow-scrolling:touch}
#end .wrap{align-items:stretch}
#end .panel{overflow-wrap:anywhere}

@media(max-width:760px){
 body{border-width:5px}
 .screen{width:100%;min-height:calc(100dvh - 10px);height:auto;padding:8px;gap:9px}
 .wrap{flex-direction:column;flex:0 0 auto;min-height:auto;gap:10px}
 .panel{width:100%;flex:0 0 auto;padding:12px;overflow:visible}
 #game .top{gap:7px;justify-content:center}
 #game .top .chip{font-size:clamp(14px,3.7vw,18px);padding:4px 8px}
 #game .main{flex:0 0 auto;min-height:auto;justify-content:flex-start;gap:10px}
 #qtext{font-size:clamp(18px,5vw,25px);line-height:1.55;text-align:left;padding:13px;border-radius:12px}
 #fig svg{max-width:100%;max-height:none}
 .opts{grid-template-columns:minmax(0,1fr);gap:9px}
 .opt{width:100%;border-radius:15px;padding:12px;font-size:clamp(17px,4.5vw,22px);text-align:left}
 .opts.tf .opt{padding:14px;font-size:clamp(22px,6vw,30px)}
 .opts.sa{display:flex;flex-direction:column;align-items:stretch}
 .opts.sa input{width:100%;max-width:none;font-size:22px}
 .ll .btn{flex:1 1 140px;font-size:16px;padding:9px 10px}
 #fb{flex-direction:column;gap:10px;padding:12px}
 #btnNext{width:100%;font-size:18px;padding:10px}
 #fbT{font-size:21px}
 #fbE{font-size:17px;line-height:1.5}
 .lbl{white-space:normal;overflow-wrap:anywhere}
 #intro .panel{width:100%;max-height:calc(100dvh - 30px)}
 .btn{max-width:100%;white-space:normal}
}
@media(max-width:380px){
 .screen{padding:6px}
 #qtext{font-size:17px;padding:10px}
 .opt{font-size:16px;padding:10px}
 #game .top .chip{font-size:13px}
}
</style>
</head>
<body>
