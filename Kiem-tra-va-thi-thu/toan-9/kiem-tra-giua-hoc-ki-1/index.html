
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Thư viện đề giữa kì 1 Toán 9 - THẦY HÒA</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f1f5f9;
    color: #183153;
}

header {
    padding: 30px 15px;
    text-align: center;
    color: white;
    background: linear-gradient(120deg,#102c54,#1765a5,#087eaa);
}

header h1 { margin: 0 0 12px; }

.container {
    max-width: 1250px;
    margin: auto;
    padding: 20px;
}

.toolbar {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 15px;
}

input {
    flex: 1;
    min-width: 200px;
    padding: 14px;
    border: 1px solid #cbd5e1;
    border-radius: 9px;
    font-size: 15px;
}

button, .download {
    padding: 12px 16px;
    background: #1261a0;
    color: white;
    border: 0;
    border-radius: 8px;
    cursor: pointer;
    text-decoration: none;
    font-weight: bold;
}

.layout {
    display: grid;
    grid-template-columns: 340px 1fr;
    gap: 18px;
}

.panel {
    background: white;
    border-radius: 12px;
    padding: 16px;
    box-shadow: 0 3px 12px #00000010;
    min-width: 0;
}

.file {
    padding: 13px;
    margin-bottom: 9px;
    border: 1px solid #e2e8f0;
    border-radius: 9px;
    cursor: pointer;
    overflow-wrap: anywhere;
}

.file:hover, .file.active {
    background: #e0f2fe;
    border-color: #0284c7;
}

#viewer {
    width: 100%;
    height: 750px;
    border: none;
    background: #f8fafc;
    border-radius: 8px;
}

.actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 12px;
}

.status {
    padding: 12px;
    color: #475569;
    background: #f8fafc;
    border-radius: 8px;
    margin-bottom: 15px;
}

@media(max-width:800px) {
    .layout { grid-template-columns: 1fr; }
    #viewer { height: 600px; }
}
</style>
</head>

<body>

<header>
    <h1>📚 THƯ VIỆN ĐỀ KIỂM TRA GIỮA KÌ 1</h1>
    <p>CHINH PHỤC TOÁN HỌC – THẦY HÒA AI</p>
    <p>Học tập chủ động – Rèn luyện tư duy – Bứt phá điểm số</p>
</header>

<div class="container">

    <div class="status" id="status">
        ⏳ Đang kết nối GitHub để tải danh sách đề...
    </div>

    <div class="toolbar">
        <input
            id="search"
            type="search"
            placeholder="🔍 Tìm kiếm đề kiểm tra..."
        >

        <button onclick="loadPDFs()">
            🔄 Làm mới danh sách
        </button>
    </div>

    <div class="layout">

        <div class="panel">
            <h3>📖 DANH SÁCH ĐỀ PDF</h3>
            <div id="fileList"></div>
        </div>

        <div class="panel">
            <h3 id="title">📄 Chọn đề để xem</h3>

            <div class="actions">
                <a id="download"
                   class="download"
                   href="#"
                   target="_blank"
                   rel="noopener"
                   style="display:none">
                   ⬇ Tải PDF
                </a>

                <button onclick="openNewTab()">
                    ↗ Mở tab mới
                </button>
            </div>

            <iframe
                id="viewer"
                title="Xem đề kiểm tra PDF"
                src="about:blank">
            </iframe>
        </div>

    </div>
</div>

<script>

// =====================================
// THÔNG TIN REPOSITORY GITHUB
// =====================================

const OWNER = "hoaltc3cd";
const REPO = "thay-hoa-";
const BRANCH = "main";

const FOLDER =
"Toan-9/Kiem-tra/De-giua-ki-1";

const API =
`https://api.github.com/repos/${OWNER}/${REPO}/contents/${FOLDER}?ref=${BRANCH}`;

let pdfFiles = [];
let selectedFile = null;

// =====================================
// TẢI DANH SÁCH PDF TỰ ĐỘNG
// =====================================

async function loadPDFs() {

    const status = document.getElementById("status");
    const list = document.getElementById("fileList");

    status.textContent = "⏳ Đang đọc dữ liệu từ GitHub...";
    list.replaceChildren();

    try {

        const response = await fetch(API, {
            headers: {
                "Accept": "application/vnd.github+json"
            },
            cache: "no-store"
        });

        if (!response.ok) {
            throw new Error(
                response.status === 404
                ? "Không tìm thấy thư mục. Hãy kiểm tra tên thư mục, repository và nhánh main."
                : response.status === 403
                ? "GitHub tạm giới hạn số lượt truy cập API. Vui lòng thử lại sau."
                : "GitHub trả về lỗi HTTP " + response.status
            );
        }

        const data = await response.json();

        if (!Array.isArray(data)) {
            throw new Error("Dữ liệu thư mục GitHub không hợp lệ.");
        }

        pdfFiles = data.filter(file =>
            file.type === "file" &&
            file.name.toLowerCase().endsWith(".pdf")
        ).sort((a,b) =>
            a.name.localeCompare(b.name, "vi")
        );

        selectedFile = null;

        document.getElementById("viewer").src = "about:blank";
        document.getElementById("title").textContent =
            " Chọn đề để xem";

        document.getElementById("download").style.display = "none";

        renderList();

        status.textContent =
            " Đã tìm thấy " + pdfFiles.length +
            " file PDF trong thư mục GitHub.";

    } catch(error) {

        status.textContent = "⚠️ " + error.message;

        list.textContent =
            "Không thể tải danh sách đề. Hãy kiểm tra kết nối và cấu hình GitHub.";

    }
}

// =====================================
// HIỂN THỊ DANH SÁCH
// =====================================

function renderList() {

    const keyword = document
        .getElementById("search")
        .value.toLowerCase();

    const list = document.getElementById("fileList");

    list.replaceChildren();

    const filtered = pdfFiles.filter(file =>
        file.name.toLowerCase().includes(keyword)
    );

    if (!filtered.length) {
        list.textContent = "Chưa tìm thấy file PDF phù hợp.";
        return;
    }

    filtered.forEach(file => {

        const item = document.createElement("div");

        item.className = "file" +
            (selectedFile?.name === file.name ? " active" : "");

        item.textContent = "📘 " + file.name;

        item.onclick = () => openPDF(file);

        list.appendChild(item);

    });
}

// =====================================
// MỞ FILE PDF
// =====================================

function openPDF(file) {

    selectedFile = file;

    const url = file.download_url;

    document.getElementById("title").textContent =
        "📄 " + file.name;

    document.getElementById("viewer").src = url;

    const download = document.getElementById("download");

    download.href = url;
    download.style.display = "inline-block";

    renderList();

}

// =====================================
// MỞ PDF TRONG TAB MỚI
// =====================================

function openNewTab() {

    if (!selectedFile) {
        alert("Vui lòng chọn một đề kiểm tra!");
        return;
    }

    window.open(
        selectedFile.download_url,
        "_blank",
        "noopener"
    );

}

// =====================================
// TÌM KIẾM VÀ KHỞI ĐỘNG
// =====================================

document.getElementById("search")
    .addEventListener("input", renderList);

loadPDFs();

</script>

<footer style="text-align:center;padding:25px;color:#64748b">
    © THẦY HÒA – Cổng học tập số
</footer>

</body>
</html>
