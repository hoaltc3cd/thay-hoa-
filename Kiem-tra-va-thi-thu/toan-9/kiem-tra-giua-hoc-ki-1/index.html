
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thư viện đề giữa kì 1 - Toán 9 | THẦY HÒA</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f1f5f9;
    color: #172554;
}

header {
    background: linear-gradient(120deg,#102c54,#1765a5,#087eaa);
    color: white;
    padding: 28px 15px;
    text-align: center;
}

header h1 {
    margin: 0 0 10px;
    font-size: 27px;
}

header p { margin: 0; }

.container {
    max-width: 1200px;
    margin: auto;
    padding: 20px;
}

.toolbar {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 18px;
}

input {
    flex: 1;
    min-width: 220px;
    padding: 13px;
    border: 1px solid #cbd5e1;
    border-radius: 9px;
    font-size: 15px;
}

button {
    border: none;
    padding: 12px 18px;
    border-radius: 9px;
    background: #1261a0;
    color: white;
    cursor: pointer;
    font-weight: bold;
}

button:hover { opacity: .85; }

.main {
    display: grid;
    grid-template-columns: 310px 1fr;
    gap: 18px;
}

.sidebar, .viewer {
    background: white;
    border-radius: 13px;
    padding: 16px;
    box-shadow: 0 3px 12px #00000010;
}

.sidebar h3, .viewer h3 {
    margin-top: 0;
    color: #124c7b;
}

.file-item {
    padding: 13px;
    border: 1px solid #e2e8f0;
    border-radius: 9px;
    margin-bottom: 9px;
    cursor: pointer;
    line-height: 1.5;
    overflow-wrap: anywhere;
}

.file-item:hover, .file-item.active {
    background: #e0f2fe;
    border-color: #0284c7;
}

.file-item.active {
    font-weight: bold;
}

.viewer iframe {
    width: 100%;
    height: 720px;
    border: 0;
    border-radius: 8px;
    background: #f8fafc;
}

.viewer-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 12px;
}

.viewer-actions a {
    background: #0f766e;
    color: white;
    text-decoration: none;
    padding: 10px 14px;
    border-radius: 8px;
}

.empty {
    text-align: center;
    color: #64748b;
    padding: 30px 10px;
}

footer {
    text-align: center;
    padding: 22px;
    color: #64748b;
}

@media(max-width:800px) {
    .main { grid-template-columns: 1fr; }
    .viewer iframe { height: 600px; }
    header h1 { font-size: 21px; }
}
</style>
</head>

<body>

<header>
    <h1> THƯ VIỆN ĐỀ KIỂM TRA GIỮA KÌ 1</h1>
    <p>CHINH PHỤC TOÁN HỌC – THẦY HÒA</p>
    <p>Học tập chủ động – Rèn luyện tư duy – Bứt phá điểm số</p>
</header>

<div class="container">

    <div class="toolbar">
        <input
            id="search"
            type="text"
            placeholder=" Tìm kiếm tên đề kiểm tra..."
            oninput="renderList()">
    </div>

    <div class="main">

        <div class="sidebar">
            <h3> DANH SÁCH ĐỀ</h3>
            <div id="fileList"></div>
        </div>

        <div class="viewer">
            <h3 id="currentTitle"> Chọn một đề để xem</h3>

            <div class="viewer-actions">
                <a id="downloadBtn" href="#" download>
                     Tải đề PDF
                </a>
                <button onclick="openNewTab()">
                    ↗ Mở tab mới
                </button>
            </div>

            <iframe id="pdfViewer"
                title="Trình xem đề PDF"
                src="about:blank">
            </iframe>
        </div>

    </div>
</div>

<footer>
    ©  THẦY HÒA – Cổng học tập số
</footer>

<script>

// ==================================
// DANH SÁCH FILE PDF CẦN HIỂN THỊ
// ==================================

const pdfFiles = [

    {
        name: "Đề cương ôn giữa kì 1",
        file: "./De-cuong-on-tap-giua-hoc-ki-1-Toan-10-nam-26-27.docx"
    },
    
    {
        name: "Đề trường THCS Nguyễn Trải – Quảng Ninh",
        file: "./de-giua-hoc-ki-1-toan-9-nam-2026-2027-truong-thcs-nguyen-trai-quang-ninh.pdf"
    },

    {
        name: "Đề trường THCS Trọng Điểm – Quảng Ninh",
        file: "./de-giua-hoc-ky-1-toan-9-nam-2026-2027-truong-thcs-trong-diem-quang-ninh.pdf"
    }

];

// ==================================
// HIỂN THỊ DANH SÁCH
// ==================================

let selectedFile = null;

function renderList() {

    const keyword =
        document.getElementById("search").value.toLowerCase();

    const list = document.getElementById("fileList");

    const filtered = pdfFiles.filter(item =>
        item.name.toLowerCase().includes(keyword)
    );

    list.innerHTML = "";

    if (filtered.length === 0) {
        list.innerHTML =
            '<div class="empty">Không tìm thấy đề kiểm tra.</div>';
        return;
    }

    filtered.forEach(item => {

        const div = document.createElement("div");

        div.className = "file-item" +
            (selectedFile === item ? " active" : "");

        div.textContent = "📘 " + item.name;

        div.onclick = () => openPDF(item);

        list.appendChild(div);

    });

}

// ==================================
// MỞ FILE PDF
// ==================================

function openPDF(item) {

    selectedFile = item;

    document.getElementById("currentTitle").textContent =
        "📄 " + item.name;

    document.getElementById("pdfViewer").src = item.file;

    document.getElementById("downloadBtn").href = item.file;

    renderList();

}

// ==================================
// MỞ PDF Ở TAB MỚI
// ==================================

function openNewTab() {

    if (!selectedFile) {
        alert("Vui lòng chọn một đề kiểm tra!");
        return;
    }

    window.open(selectedFile.file, "_blank");

}

// KHỞI ĐỘNG
renderList();

</script>

</body>
</html>
